server.port=8080
spring.application.name=server
app.jwt.secret=${JWT_SECRET:server-development-secret-must-be-replaced-in-production-2026}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cep-geocoder.base-url=${CEP_GEOCODER_BASE_URL:https://brasilapi.com.br/api/cep/v2}
app.cache.ttl=10m

# Operational endpoints: health is public; the security filter protects the rest.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=${APP_VERSION:0.0.1-SNAPSHOT}
info.app.environment=${SPRING_PROFILES_ACTIVE:local}
info.app.revision=${GIT_COMMIT:unknown}

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true

# === LOGGING ===
logging.structured.format.console=logstash
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.web=WARN

# === CONFIGURAÇÕES ADICIONAIS ===
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true